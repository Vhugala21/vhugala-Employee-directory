# Employee Directory - Spring Boot Configuration
#
# PostgreSQL is the persistent database configuration for the app. This is the
# setup used by the Docker Compose stack and the Testcontainers-based tests.

spring.application.name=employee-directory
spring.datasource.url=jdbc:postgresql://localhost:5432/employees
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080
