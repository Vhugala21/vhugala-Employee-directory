# Employee Directory - Spring Boot Configuration
#
# Database credentials are injected via environment variables (DB_URL, DB_USER,
# DB_PASSWORD) so no secret is committed to git. Docker Compose and CI set these
# at deploy time; the local-dev defaults below only target a throwaway localhost
# database and are overridden by the environment when one is provided.

spring.application.name=employee-directory
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employees}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080
